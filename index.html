<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFT preview card component</title>
    <!-- File Style -->
    <link rel="stylesheet" href="Style/main.css" />
    <!-- Font Outfit From Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <img src="images/image-equilibrium.jpg" alt="Equilibrium" />
      <div class="main">
        <h1>Equilibrium #3429</h1>
        <p>Our Equilibrium collection promotes balance and calm.</p>
      </div>
      <div class="details">
        <span class="one">0.041 ETH</span>
        <span class="two">3 days left</span>
      </div>
      <hr />
      <div class="end">
        <img src="images/image-avatar.png" alt="Avatar" />
        <p>Creation of Jules Wyvern</p>
      </div>
      <div class="contact">
        <p>
          Challenge by
          <a href="https://www.frontendmentor.io/home" target="_blank">
            Frontend Mentor
          </a>
          Coded by
          <a href="https://github.com/O-h-coder" target="_blank">Omar Hanfy</a>
        </p>
      </div>
    </div>
  </body>
</html>
